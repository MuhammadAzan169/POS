{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} product — A-POS{% endblock %}
{% block body %}
<h1>{{ 'Edit' if product else 'Add' }} product</h1>

<form class="form" method="post">
  <label>Barcode / Item code
    {% if product %}
      <input value="{{ product.barcode }}" disabled>
    {% else %}
      <input name="barcode" required autofocus placeholder="e.g. 1007">
    {% endif %}
  </label>
  <label>Name <input name="name" required value="{{ product.name if product else '' }}"></label>
  <div class="row">
    <label>Category <input name="category" value="{{ product.category if product else '' }}"></label>
    <label>Brand <input name="brand" value="{{ product.brand if product else '' }}"></label>
  </div>
  <div class="row">
    <label>Size <input name="size" value="{{ product.size if product else '' }}"></label>
    <label>Color <input name="color" value="{{ product.color if product else '' }}"></label>
  </div>
  <div class="row">
    <label>Cost <input name="cost" type="number" step="any" value="{{ product.cost if product else 0 }}"></label>
    <label>Price <input name="price" type="number" step="any" value="{{ product.price if product else 0 }}"></label>
  </div>
  <div class="row">
    <label>Stock <input name="stock" type="number" value="{{ product.stock if product else 0 }}"></label>
    <label>Low alert <input name="low_alert" type="number" value="{{ product.low_alert if product else 0 }}"></label>
  </div>
  <div class="form-actions">
    <button class="btn">Save</button>
    <a class="btn ghost" href="{{ url_for('products') }}">Cancel</a>
  </div>
</form>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}A-POS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="sidebar">
    <div class="brand">A-POS</div>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('sale') }}" class="hot">New Sale</a>
    <a href="{{ url_for('sales_list') }}">Sales</a>
    <a href="{{ url_for('products') }}">Products</a>
    <a href="{{ url_for('customers') }}">Customers</a>
    <a href="{{ url_for('suppliers') }}">Suppliers</a>
    <a href="{{ url_for('reports') }}">Reports</a>
  </nav>

  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
